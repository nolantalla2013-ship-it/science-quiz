<link rel="stylesheet" href="style.css">
 <div class="quiz-container">
  <h1>Brain Boost</h1>
  <p class="subtitle">Test your knowledge!</p>

  <div id="start-screen">
    <p>Ready for a quick science challenge?</p>
    <button id="start-btn">Start Quiz</button>
  </div>

  <div id="quiz-screen" hidden>
    <p id="progress"></p>
    <h2 id="question"></h2>
    <div id="answers"></div>
    <p id="feedback"></p>
    <button id="next-btn" hidden>Next Question</button>
  </div>

  <div id="result-screen" hidden>
    <h2>Quiz Complete!</h2>
    <p id="final-score"></p>
    <button id="restart-btn">Play Again</button>
  </div>
</div>
